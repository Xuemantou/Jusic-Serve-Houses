# ============================================================
# Jusic 点歌房 · Docker Compose 完整栈
#
#   cp .env.example .env && vi .env     # 首次：填好「必改」项
#   docker compose up -d
#   浏览器打开 http://localhost:8080
#
# 三个服务：
#   redis      房间 / 点歌列表 / 配置存储（只在容器网络内，不暴露端口）
#   music-api  音乐 API 聚合：网易(:3000) + QQ(:3300)
#   jusic      后端 + 前端（前端已打进 jar，同源提供，无需单独镜像）
#
# 音源：仅使用网易云与 QQ。咪咕与酷我/虾米已在代码中移除。
#
# 常用命令：
#   docker compose logs -f jusic     看后端日志
#   docker compose ps                看状态
#   docker compose down              停止（保留数据卷）
# ============================================================

services:
  redis:
    image: redis:7-alpine
    container_name: jusic-redis
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  music-api:
    # 二合一聚合镜像：网易(3000) + QQ(3300)。
    # 本地构建方式见 .docker-build/Dockerfile；也可以换成你自己的远端镜像，例如：
    #   image: yourname/jusic-music-api:2in1
    image: jusic-music-api:2in1
    container_name: jusic-music-api
    restart: always
    environment:
      TZ: Asia/Shanghai
      # 灌 QQ 会员 cookie（POST /user/setCookie）时，cookie 里的 uin 必须等于这个值，
      # 否则不会被登记为全局登录态，VIP 曲目取不到播放地址。
      QQ: "${QQ:-1040927107}"
      # QQ 会员 cookie：从 y.qq.com 的「请求头 → Cookie」整行复制。填了就在启动时自动登记为
      # 服务端全局登录态（换 cookie 只需改 .env 再 up -d）；留空则沿用 qq-data 卷里的旧登录态。
      QqCookie: "${QqCookie:-}"
    volumes:
      # 持久化 QQ 登录态（data/cookie.json），容器重建不丢
      - qq-data:/app/qq/data
    expose:
      - "3000"
      - "3300"
    ports:
      # 只绑定本机回环，不对外网开放。
      # 用途：灌 QQ 会员 cookie（POST /user/setCookie）以及验证取链是否生效。
      # 网易不需要它——网易 cookie 是通过后端的 /netease/setCookiePost 存进 Redis 的。
      - "127.0.0.1:3300:3300"

  jusic:
    build: .
    image: jusic-serve-houses:latest
    container_name: jusic-serve
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      music-api:
        condition: service_started
    ports:
      - "8080:8888"
    environment:
      TZ: Asia/Shanghai
      # 容器网络内的服务名，固定写死；不要照搬裸跑时的 127.0.0.1
      RedisHost: redis
      MusicApi: http://music-api
      # 以下各项从同目录 .env 读取，缺省时用这里的默认值
      APIUSER: "${APIUSER:-admin}"
      APIPWD: "${APIPWD:-1}"
      RoleRootPassword: "${RoleRootPassword:-654321}"
      HouseSize: "${HouseSize:-128}"
      IpHouse: "${IpHouse:-128}"
      PlaylistSize: "${PlaylistSize:-23}"
      MusicExpireTime: "${MusicExpireTime:-1200000}"
      ReTryCount: "${ReTryCount:-2}"
      VoteRate: "${VoteRate:-0.3}"
      WyTopUrl: "${WyTopUrl:-3778678}"
      # WyAccount 同时是 Redis 里网易 cookie 的键名，改动后需重新灌 cookie
      WyAccount: "${WyAccount:-}"
      # 网易云会员 cookie（含 MUSIC_U）：填了就在启动时自动灌入；留空则沿用 Redis 里的旧登录态
      WyCookie: "${WyCookie:-}"
      ServerJUrl: "${ServerJUrl:-}"
      MailFrom: "${MailFrom:-}"
      MailTo: "${MailTo:-}"
      MiniId: "${MiniId:-}"
      MiniSecrect: "${MiniSecrect:-}"
    volumes:
      # 业务日志：logs/common-all.log（全量，带方法名与行号）、logs/common-error.log
      - ./logs:/app/logs

volumes:
  redis-data:
  qq-data:

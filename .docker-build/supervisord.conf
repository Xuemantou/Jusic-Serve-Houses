[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; 网易云音乐 API —— 后端 jusic.music-serve-domain (:3000)
[program:netease]
command=node app.js
directory=/app/netease
environment=PORT="3000"
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; QQ 音乐 API —— 后端 jusic.music-serve-domain-qq (:3300)
; QQ 号由容器环境变量 QQ 传入（bin/www: global.QQ = process.env.QQ || config.qq），
; 只有 /user/setCookie 灌入的 uin 与该值一致时，cookie 才会被登记为全局登录态。
[program:qqmusic]
command=node ./bin/www
directory=/app/qq
environment=PORT="3300"
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

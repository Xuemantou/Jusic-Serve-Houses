<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一起听歌吧</title>
    <script>
      // 启动错误可视化：把 JS 错误直接显示在页面上，避免"白屏无提示"
      (function () {
        window.__jusicErrors = []
        function render(msg) {
          window.__jusicErrors.push(msg)
          document.title = '启动错误: ' + msg.slice(0, 80)
          var box = document.getElementById('boot-error')
          if (!box) {
            box = document.createElement('pre')
            box.id = 'boot-error'
            box.style.cssText =
              'position:fixed;inset:0;z-index:99999;margin:0;padding:16px;overflow:auto;' +
              'background:#1e1e1e;color:#ff6b6b;font:12px/1.6 monospace;white-space:pre-wrap'
            ;(document.body || document.documentElement).appendChild(box)
          }
          box.textContent = '启动失败（请把以下信息反馈给开发者）:\n\n' + window.__jusicErrors.join('\n\n')
        }
        window.addEventListener(
          'error',
          function (e) {
            // 资源加载错误：target 为具体元素（img/script/link 等）
            if (e.target && e.target !== window && e.target.tagName) {
              var tag = e.target.tagName
              var src = e.target.src || e.target.href || ''
              if (tag === 'SCRIPT' || tag === 'LINK') {
                render('关键资源加载失败 <' + tag.toLowerCase() + '>: ' + src)
              } else {
                // 图片等非致命资源：仅记录，不覆盖页面
                window.__jusicErrors.push('资源加载失败 <' + tag.toLowerCase() + '>: ' + src)
                console.warn('[jusic] 资源加载失败:', tag, src)
              }
              return
            }
            // 真正的 JS 运行时错误
            if (!e.message) return
            render(
              'JS 错误: ' +
                e.message +
                '\n  位置: ' +
                (e.filename || '?') +
                ':' +
                (e.lineno || 0) +
                ':' +
                (e.colno || 0),
            )
          },
          true,
        )
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          render('未处理的 Promise 拒绝: ' + ((r && (r.stack || r.message)) || String(r)))
        })
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-LLRg6KjP.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B3T9r5zz.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一起听歌吧</title>
    <script>
      // 启动错误可视化：把「真正的」JS 错误显示在页面上，避免白屏无提示。
      //
      // 注意：浏览器与框架会抛出一些良性告警，最典型的是
      //   ResizeObserver loop completed with undelivered notifications
      // （Vuetify 的表格、弹窗等组件调整尺寸时经常触发，纯属告警，页面功能不受影响）。
      // 这类信息只能记到 console，绝不能弹成全屏「启动失败」——那会把用户吓一跳，
      // 还会掩盖真正的问题。
      (function () {
        window.__jusicErrors = []

        /** 已知的良性告警：命中则只记 console，不弹面板（不锚定，因为入参带格式化前缀） */
        var BENIGN =
          /ResizeObserver loop|Script error\.?|Non-Error (promise )?rejection|AbortError|interrupted by a call to pause/i

        function render(msg) {
          if (BENIGN.test(String(msg))) {
            window.__jusicErrors.push('[良性告警，已忽略] ' + msg)
            console.warn('[jusic] 忽略良性告警:', msg)
            return
          }
          window.__jusicErrors.push(msg)
          document.title = '页面错误: ' + String(msg).slice(0, 80)
          var box = document.getElementById('boot-error')
          if (!box) {
            box = document.createElement('pre')
            box.id = 'boot-error'
            box.title = '点击关闭'
            box.style.cssText =
              'position:fixed;inset:0;z-index:99999;margin:0;padding:16px;overflow:auto;cursor:pointer;' +
              'background:#1e1e1e;color:#ff6b6b;font:12px/1.6 monospace;white-space:pre-wrap'
            // 点击即可关闭，避免一直挡住页面
            box.onclick = function () {
              box.remove()
            }
            ;(document.body || document.documentElement).appendChild(box)
          }
          box.textContent =
            '页面出现错误（点击此处关闭；如需反馈，请把下面内容一并给开发者）:\n\n' +
            window.__jusicErrors.join('\n\n')
        }

        window.addEventListener(
          'error',
          function (e) {
            // 资源加载错误：target 为具体元素（img/script/link 等）
            if (e.target && e.target !== window && e.target.tagName) {
              var tag = e.target.tagName
              var src = e.target.src || e.target.href || ''
              if (tag === 'SCRIPT' || tag === 'LINK') {
                render('关键资源加载失败 <' + tag.toLowerCase() + '>: ' + src)
              } else {
                // 图片等非致命资源：仅记录，不覆盖页面
                window.__jusicErrors.push('资源加载失败 <' + tag.toLowerCase() + '>: ' + src)
                console.warn('[jusic] 资源加载失败:', tag, src)
              }
              return
            }
            // JS 运行时错误
            if (!e.message) return
            render(
              'JS 错误: ' +
                e.message +
                '\n  位置: ' +
                (e.filename || '?') +
                ':' +
                (e.lineno || 0) +
                ':' +
                (e.colno || 0),
            )
          },
          true,
        )
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason
          render('未处理的 Promise 拒绝: ' + ((r && (r.stack || r.message)) || String(r)))
        })
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-BOYAQk2-.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B3T9r5zz.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
